[package]
name = "php-ext-zendtest"
description = "ext/zend_test binding for the phprust VM (the engine's test extension)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
php-vm = { path = "../php-vm" }
php-runtime = { path = "../php-runtime" }
php-support = { path = "../php-support" }
php-parser = { path = "../php-parser" }
php-memlimit = { path = "../php-memlimit" }
php-streams = { path = "../php-streams" }
php-ext-streams = { path = "../php-ext-streams" }
php-stdmisc = { path = "../php-stdmisc" }
php-cli-server = { path = "../php-cli-server" }
php-sapi-input = { path = "../php-sapi-input" }
php-ext-uri = { path = "../php-ext-uri" }
libc = "0.2"

[features]
default = ["observer"]
# Parts that need the VM hooks proposed in `proposals/vm-hooks.diff`: the
# observer printer (`zend_test.observer.*`) and internal attribute
# classes with validators.
vm-hooks = ["observer"]
observer = []

[lints]
workspace = true
