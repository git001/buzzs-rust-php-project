[package]
name = "php-dom"
description = "PHP's ext/dom: DOMDocument & friends and the PHP 8.4 Dom\\ API over the system libxml2, with a lexbor-backed HTML5 parser and CSS selectors"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
rustc-hash = "2"
php-libxml = { path = "../php-libxml" }
php-memlimit = { path = "../php-memlimit" }

[dev-dependencies]
php-parser = { path = "../php-parser" }
php-lexer = { path = "../php-lexer" }
phpt-runner = { path = "../phpt-runner" }

[build-dependencies]
cc = "1"

[lints]
workspace = true
