[package]
name = "php-sqlite"
description = "PHP's ext/sqlite3 and ext/pdo_sqlite: SQLite3/SQLite3Stmt/SQLite3Result semantics, the PDO SQLite driver and the PDO SQL placeholder parser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
php-memlimit = { path = "../php-memlimit" }
php-runtime = { path = "../php-runtime" }
php-streams = { path = "../php-streams" }
libsqlite3-sys = { version = "0.37", default-features = false, features = ["min_sqlite_version_3_34_1"] }

[lints]
workspace = true
