[package]
name = "php-ext-spl"
description = "ext/spl bindings: registers the php-spl classes, handlers and functions with the phprust VM"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rustc-hash = "2"
php-vm = { path = "../php-vm" }
php-runtime = { path = "../php-runtime" }
php-spl = { path = "../php-spl" }
php-stdarr = { path = "../php-stdarr" }
php-pcre = { path = "../php-pcre" }
php-streams = { path = "../php-streams" }
php-ext-streams = { path = "../php-ext-streams" }

[dev-dependencies]
# Script tests use standard array/string functions (count, implode, reset...).
php-ext-stdarr = { path = "../php-ext-stdarr" }
php-ext-stdstr = { path = "../php-ext-stdstr" }

[lints]
workspace = true
