[package]
name = "php-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "php"
path = "src/main.rs"

[[bin]]
name = "php-cgi"
path = "src/cgi/main.rs"

[dependencies]
php-vm = { path = "../php-vm" }
php-parser = { path = "../php-parser" }
php-memlimit = { path = "../php-memlimit" }
php-runtime = { path = "../php-runtime" }
php-support = { path = "../php-support" }
php-sapi = { path = "../php-sapi" }
php-extensions = { path = "../php-extensions" }
php-log = { path = "../php-log" }
php-streams = { path = "../php-streams" }
php-ext-opcache = { path = "../php-ext-opcache" }
php-cli-server = { path = "../php-cli-server" }
libc = "0.2"

[lints]
workspace = true
