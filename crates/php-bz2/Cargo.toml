[package]
name = "php-bz2"
description = "PHP's ext/bz2: bzcompress/bzdecompress, BZFILE streams (bzopen/bzread/bzwrite/bzerror) and the bzip2.* stream filters, bound to libbz2"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
libbz2-rs-sys = { version = "0.2.6", default-features = false, features = ["rust-allocator"] }
libc = "0.2"
php-memlimit = { path = "../php-memlimit" }
php-streams = { path = "../php-streams" }

[lints]
workspace = true
