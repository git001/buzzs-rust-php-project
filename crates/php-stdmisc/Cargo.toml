[package]
name = "php-stdmisc"
description = "The remaining 'misc' of PHP's ext/standard: crypt/password hashing, exec/proc_open, network/DNS, environment/info, highlighting, getopt, http_build_query/parse_str, locale, mail, error_log"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
php-memlimit = { path = "../php-memlimit" }
php-runtime = { path = "../php-runtime" }
php-lexer = { path = "../php-lexer" }
php-hash = { path = "../php-hash" }
php-random = { path = "../php-random" }
php-log = { path = "../php-log" }
php-timer = { path = "../php-timer" }
libc = "0.2"

[lints]
workspace = true
