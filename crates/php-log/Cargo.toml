description = "PHP's logging core: php_log_err_with_severity (main/main.c) and php_syslog (main/php_syslog.c), shared by the engine, ext/standard and every SAPI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
php-support = { path = "../php-support" }
php-observability = { path = "../php-observability" }
php-sapi = { path = "../php-sapi" }
libc = "0.2"

[dev-dependencies]
php-streams = { path = "../php-streams" }
php-date = { path = "../php-date" }

[lints]
workspace = true
