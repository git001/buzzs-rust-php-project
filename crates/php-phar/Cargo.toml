[package]
name = "php-phar"
description = "PHP's ext/phar: phar/tar/zip archive formats, manifest, signatures, stubs, the phar:// stream wrapper and the Phar/PharData/PharFileInfo method semantics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
php-runtime = { path = "../php-runtime" }
php-hash = { path = "../php-hash" }
php-streams = { path = "../php-streams" }
php-zlib = { path = "../php-zlib" }
# Binds libbz2 directly for the two default-parameter stream filters it
# needs (the libbz2-rs-sys Rust port, as php-bz2).
libbz2-rs-sys = { version = "0.2.6", default-features = false, features = ["rust-allocator"] }
libc = "0.2"

[lints]
workspace = true
