    "crates/phpt-runner",
    "crates/php-support",
    "crates/php-sapi",
    "crates/php-log",
    "crates/php-observability",
    "crates/php-sapi-input",
    "crates/php-hash",
    "crates/php-random",
    "crates/php-date",
    "crates/php-pcre",
    "crates/php-stdstr",
    "crates/php-streams",
    "crates/php-stdarr",
    "crates/php-mbstring",
    "crates/php-json",
    "crates/php-filter",
    "crates/php-ctype",
    "crates/php-opcache",
    "crates/php-uri",
    "crates/php-bcmath",
    "crates/php-gmp",
    "crates/php-calendar",
    "crates/php-zlib",
    "crates/php-bz2",
    "crates/php-iconv",
    "crates/php-posix",
    "crates/php-openssl",
    "crates/php-sqlite",
    "crates/php-libxml",
    "crates/php-intl",
    "crates/php-exif",
    "crates/php-sockets",
    "crates/php-sysv",
    "crates/php-gettext",
    "crates/php-pcntl",
    "crates/php-spl",
    "crates/php-session",
    "crates/php-stdmisc",
    "crates/php-phar",
    "crates/php-dom",
    "crates/php-simplexml",
    "crates/php-xmlreader",
    "crates/php-pdo",
    "crates/php-soap",
    "crates/php-ext-filter",
    "crates/php-ext-stdmisc",
    "crates/php-mysqlnd",
    "crates/php-ext-mysqli",
    "crates/php-zip",
    "crates/php-fileinfo",
    "crates/php-sodium",
    "crates/php-xsl",
    "crates/php-memlimit",
    "crates/php-ext-tokenizer",
    "crates/php-cli-server",
    "crates/php-curl",
    "crates/php-ext-curl",
    "crates/php-ftp",
    "crates/php-ext-ftp",
    "crates/php-ext-soap",
    "crates/php-ext-pcntl",
    "crates/php-ext-gettext",
    "crates/php-ext-sysv",
    "crates/php-ext-sockets",
    "crates/php-ext-phar",
    "crates/php-ext-uri",
    "crates/php-ext-exif",
    "crates/php-ext-calendar",
    "crates/php-ext-gmp",
    "crates/php-ext-bcmath",
    "crates/php-ext-xmlreader",
    "crates/php-ext-simplexml",
    "crates/php-ext-xml",
    "crates/php-ext-dom",
    "crates/php-ext-session",
    "crates/php-ext-posix",
    "crates/php-ext-iconv",
    "crates/php-ext-zlib",
    "crates/php-ext-openssl",
    "crates/php-ext-intl",
    "crates/php-ext-fileinfo",
    "crates/php-ext-sodium",
    "crates/php-ext-zip",
    "crates/php-ext-pdo",
    "crates/php-ext-stdarr",
    "crates/php-ext-mbstring",
    "crates/php-ext-random",
    "crates/php-ext-hash",
    "crates/php-ext-spl",
    "crates/php-ext-date",
    "crates/php-ext-pcre",
    "crates/php-ext-stdstr",
    "crates/php-ext-json",
    "crates/php-ext-streams",
    "crates/php-ext-ctype",
    "crates/php-ext-opcache",
    "crates/php-ext-zendtest",
    "crates/php-gd",
    "crates/php-ext-gd",
    "crates/php-ext-xsl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
rust-version = "1.100"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# Pure-Rust crypto/bignum crates are far too slow unoptimised (argon2 ~13 s per hash in debug);
# optimise them even in dev builds so the test suite's 60 s per-test timeout is not hit.
[profile.dev.package.php-stdmisc]
opt-level = 3
[profile.dev.package.php-hash]
opt-level = 3
[profile.dev.package.php-gmp]
opt-level = 3
[profile.dev.package.php-bcmath]
opt-level = 3
[profile.dev.package.php-mbstring]
opt-level = 2
[profile.dev.package.php-runtime]
opt-level = 2
[profile.dev.package.php-lexer]
opt-level = 2
[profile.dev.package.php-parser]
opt-level = 2
# preg_* per-call overhead: at opt-level 0 the pcre glue alone costs ~1.85 µs per
# preg_match, which makes ext/pcre/tests/bug72685.phpt (65 536 calls under a 0.5 s
# limit) fail in the debug build the PHPT runs use (strings2 measurement, 6 Nov 2026).
[profile.dev.package.php-pcre]
opt-level = 2
[profile.dev.package.php-ext-pcre]
opt-level = 2
# The interpreter itself: at opt-level 0 every Option/Vec/RefCell helper is
# an out-of-line call (≈4 000 instructions per empty loop iteration). Level 1
# cuts per-call overhead 2–3× (with perf/0*.diff ≈4.6×) for ~20 s more per
# php-vm edit-rebuild. See perf/README.md.
[profile.dev.package.php-vm]
opt-level = 1
# php-cli is where `install_global_allocator!` monomorphises the counting
# allocator (php-memlimit's generic code is compiled in the *using* crate),
# so every allocation of the process runs at php-cli's opt-level.
[profile.dev.package.php-cli]
opt-level = 2
[profile.dev.package.php-memlimit]
opt-level = 3
